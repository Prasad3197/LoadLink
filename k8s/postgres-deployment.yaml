apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: loadlink-ns
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: loadlink
        - name: POSTGRES_USER
          value: loadlink
        - name: POSTGRES_PASSWORD
          value: secret  # Change this; use Secrets in prod
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: loadlink-ns
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432