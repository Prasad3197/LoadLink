apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loadlink-postgres-pvc
  namespace: your-roll-number
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loadlink-postgres
  namespace: your-roll-number
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: loadlink-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadlink-postgres
  namespace: your-roll-number
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadlink-postgres
  template:
    metadata:
      labels:
        app: loadlink-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: loadlink
            - name: POSTGRES_USER
              value: loadlink_user
            - name: POSTGRES_PASSWORD
              value: your-strong-password-2025
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: loadlink-postgres-pvc
